<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 — Server Error</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #030712;
            color: #f9fafb;
            font-family: ui-sans-serif, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .code  { font-size: 7rem; font-weight: 700; color: #111827; line-height: 1; }
        h1     { margin-top: 1rem; font-size: 1.5rem; font-weight: 700; color: #f9fafb; }
        p      { margin-top: 0.75rem; color: #6b7280; font-size: 0.9rem; max-width: 36ch; }
        .links { margin-top: 2rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn-primary {
            background: #4f46e5; color: #fff;
            padding: 0.6rem 1.5rem; border-radius: 0.75rem;
            font-size: 0.875rem; font-weight: 600; text-decoration: none;
        }
        .btn-primary:hover { background: #6366f1; }
        .btn-secondary { color: #6b7280; font-size: 0.875rem; text-decoration: none; align-self: center; }
        .btn-secondary:hover { color: #f9fafb; }
    </style>
</head>
<body>
    <div>
        <p class="code">500</p>
        <h1>Something went wrong</h1>
        <p>An unexpected error occurred on our end. We're looking into it.</p>
        <div class="links">
            <a href="/" class="btn-primary">Go home</a>
            <a href="javascript:history.back()" class="btn-secondary">← Go back</a>
        </div>
    </div>
</body>
</html>
